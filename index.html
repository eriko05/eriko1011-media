<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学びの動画ライブラリ｜長田絵里子</title>
<meta name="description" content="恋愛・夫婦関係の深層心理を、動画と音声でわかりやすく学べるライブラリ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#e6337f;--pink-dark:#c81f68;--pink-soft:#fff1f6;--pink-line:#f7c6da;
  --text:#2b2b2b;--muted:#6b6b6b;--line:#ececec;--bg:#fafafa;--card:#fff;
  --shadow:0 2px 12px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Zen Kaku Gothic New",Meiryo,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* header */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hd{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-weight:700;font-size:1.05rem;white-space:nowrap}
.logo span{color:var(--pink)}
.search{flex:1;max-width:360px;margin-left:auto;position:relative}
.search input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--line);border-radius:999px;font-size:.95rem;background:var(--bg)}
.search input:focus{outline:2px solid var(--pink-line);border-color:var(--pink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.hd-cta{background:var(--pink);color:#fff;font-weight:700;font-size:.9rem;padding:9px 16px;border-radius:999px;white-space:nowrap}
@media(max-width:640px){.hd-cta{display:none}.logo{font-size:.95rem}}

/* category nav */
.cats{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:15}
.cats ul{display:flex;gap:4px;list-style:none;margin:0 auto;padding:0 16px;max-width:1120px;overflow-x:auto;scrollbar-width:none}
.cats ul::-webkit-scrollbar{display:none}
.cats button{border:0;background:none;padding:12px 14px;font:inherit;font-size:.92rem;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.cats button[aria-pressed="true"]{color:var(--pink);border-bottom-color:var(--pink);font-weight:700}

/* hero */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;padding:28px 0 8px}
.feat{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.feat .body{padding:16px 20px 20px}
.feat h2{margin:6px 0 6px;font-size:1.35rem;line-height:1.5}
.feat p{margin:0;color:var(--muted);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.side h3,.sec-h{font-size:1.1rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.side h3::before,.sec-h::before{content:"";width:4px;height:1.1em;background:var(--pink);border-radius:2px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:28px 112px 1fr;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:8px;box-shadow:var(--shadow);cursor:pointer}
.rank .n{font-weight:700;color:var(--pink);text-align:center;font-size:1.1rem}
.rank .t{font-size:.88rem;line-height:1.45;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:860px){.hero{grid-template-columns:1fr}}

/* thumbnail（クリックされやすいデザイン） */
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;container-type:inline-size;
  --c1:#fff0f6;--c2:#ffc9de;--ac:#e6337f;--ink:#7a1240;
  background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.95) 0 1.2cqw,transparent 1.3cqw),
    radial-gradient(circle at 54% 10%,rgba(255,255,255,.8) 0 .8cqw,transparent .9cqw),
    radial-gradient(circle at 46% 88%,rgba(255,255,255,.7) 0 1cqw,transparent 1.1cqw),
    radial-gradient(ellipse at 80% 60%,rgba(255,255,255,.85),transparent 55%),
    linear-gradient(135deg,var(--c1),var(--c2))}
.thumb[data-cat="夫婦関係"]{--c1:#fff4ec;--c2:#ffcfb8;--ac:#e8572f;--ink:#7a2a12}
.thumb[data-cat="自己理解"]{--c1:#f6f0ff;--c2:#d9c8ff;--ac:#7b4fd6;--ink:#3b1f78}
.thumb[data-cat="セッション紹介"]{--c1:#eefbf6;--c2:#bfeedd;--ac:#14946a;--ink:#0d4d38}
.thumb[data-cat="婚活"]{--c1:#eef5fd;--c2:#c4dcf6;--ac:#2f6fb3;--ink:#123a66}
.thumb[data-cat="人間関係"]{--c1:#eef8f7;--c2:#bfe3e0;--ac:#1f7a80;--ink:#0f3f42}
.thumb > img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .face{position:absolute;right:-5cqw;bottom:-6cqw;width:43cqw;aspect-ratio:1;border-radius:50%;
  background:url(images/profile.jpg) center/cover;box-shadow:0 0 0 1.2cqw #fff,0 1.5cqw 4cqw rgba(0,0,0,.18)}
.thumb .copy{position:absolute;left:5cqw;top:4cqw;bottom:10cqw;width:58cqw;display:flex;flex-direction:column;justify-content:center;gap:2.4cqw;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif}
.thumb .kicker{align-self:flex-start;background:var(--ac);color:#fff;font-weight:900;font-size:4.2cqw;line-height:1;padding:1.6cqw 2.6cqw;border-radius:99cqw;
  transform:rotate(-3deg);box-shadow:0 .6cqw 0 rgba(0,0,0,.15)}
.thumb .catch{margin:0;display:block;overflow:visible;-webkit-line-clamp:unset;color:var(--ink);font-weight:900;font-size:var(--fs,8.4cqw);line-height:1.18;letter-spacing:-.02em;
  -webkit-text-stroke:2.2cqw #fff;paint-order:stroke fill;text-shadow:0 .8cqw 1.6cqw rgba(0,0,0,.12)}
.thumb .catch em{font-style:normal;color:var(--ac);background:linear-gradient(transparent 62%,#fff27a 62%,#fff27a 92%,transparent 92%)}
.thumb .badge{position:absolute;left:3cqw;bottom:3cqw;display:flex;align-items:center;gap:1.4cqw;background:rgba(0,0,0,.72);color:#fff;
  font-size:3.4cqw;font-weight:700;line-height:1;padding:1.4cqw 2.4cqw;border-radius:1.4cqw}
.thumb .badge::before{content:"";border-left:2.6cqw solid #fff;border-top:1.6cqw solid transparent;border-bottom:1.6cqw solid transparent}
.thumb .badge.audio::before{content:"🎧";border:0;font-size:3.4cqw}
.thumb .play{position:absolute;inset:0;margin:auto;width:18cqw;height:18cqw;border-radius:50%;background:rgba(230,51,127,.92);
  display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:.2s;box-shadow:0 1cqw 4cqw rgba(0,0,0,.25)}
.thumb .play::after{content:"";border-left:5.4cqw solid #fff;border-top:3.4cqw solid transparent;border-bottom:3.4cqw solid transparent;margin-left:1.4cqw}
.card:hover .thumb .play,.feat:hover .thumb .play,.rank li:hover .thumb .play,[data-i]:focus-visible .thumb .play{opacity:1;transform:scale(1)}
@media(hover:none){.thumb .play{display:none}}
/* 番号・NEW・カテゴリ色 */
.marks{position:absolute;top:2.4cqw;right:2.4cqw;display:flex;gap:1.4cqw;z-index:2}
.marks span{font-family:system-ui,sans-serif;font-weight:800;line-height:1;border-radius:99cqw;padding:1.4cqw 2.4cqw;font-size:max(3.6cqw,10px);box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.18)}
.marks .ep{background:rgba(255,255,255,.95);color:#333}
.marks .new{background:#ff3b30;color:#fff;letter-spacing:.06em}
.rank .marks{display:none}
article[data-cat]{border-top:4px solid var(--cc,#e6337f)}
[data-cat="恋愛"]{--cc:#e6337f;--cs:#fff1f6}
[data-cat="夫婦関係"]{--cc:#e8572f;--cs:#fff2ec}
[data-cat="自己理解"]{--cc:#7b4fd6;--cs:#f3eeff}
[data-cat="セッション紹介"]{--cc:#14946a;--cs:#e9f8f2}
[data-cat="婚活"]{--cc:#2f6fb3;--cs:#eaf2fb}
[data-cat="人間関係"]{--cc:#1f7a80;--cs:#e6f4f3}
.tag[data-cat]{color:var(--cc);background:var(--cs)}
.cats button[data-c]:not([data-c="すべて"])::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--cc,#ccc)}
.tag{display:inline-block;font-size:.75rem;color:var(--pink);background:var(--pink-soft);padding:2px 10px;border-radius:999px;font-weight:700}
.type{display:inline-block;font-size:.72rem;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:999px;margin-left:6px}

/* grid */
section{padding:32px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.card:focus-visible,.feat:focus-visible,.rank li:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.card .body{padding:12px 14px 16px;display:flex;flex-direction:column;gap:6px}
.card h4{margin:0;font-size:.98rem;line-height:1.5}
.card p{margin:0;color:var(--muted);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);padding:24px 0}

/* cta band */
.band{margin:48px 0 0;background:var(--pink-soft);border-top:1px solid var(--pink-line);border-bottom:1px solid var(--pink-line)}
.band .wrap{padding:36px 16px;text-align:center}
.band h3{margin:0 0 8px;font-size:1.25rem}
.band p{margin:0 0 20px;color:var(--muted)}
.btn{display:inline-block;background:var(--pink);color:#fff;font-weight:700;padding:14px 32px;border-radius:999px;box-shadow:0 4px 0 var(--pink-dark)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:28px 16px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:14px;overflow:hidden;width:100%;max-width:900px;max-height:92vh;overflow-y:auto}
.player{aspect-ratio:16/9;background:#000}
.player iframe,.player video{width:100%;height:100%;border:0;display:block}
.player.audio{aspect-ratio:auto;padding:28px 20px;background:linear-gradient(135deg,#f9c6da,#e6337f)}
.player audio{width:100%}
.mbody{padding:16px 20px 22px}
.mbody h2{margin:8px 0;font-size:1.25rem;line-height:1.5}
.mbody p{margin:0;color:var(--text);white-space:pre-wrap;line-height:1.9}
.mbody p strong{color:var(--pink)}
.doc-btn{display:inline-flex;align-items:center;gap:8px;margin:4px 0 16px;background:#fff;color:var(--pink);border:2px solid var(--pink);font-weight:700;padding:10px 18px;border-radius:999px;text-decoration:none}
.doc-btn:hover{background:var(--pink-soft)}
.doc-btn[hidden]{display:none}
.has-doc{display:inline-block;font-size:.72rem;color:#8a6a00;background:#fff7d6;border:1px solid #f1dc8a;padding:1px 8px;border-radius:999px;margin-left:6px;font-weight:700}
.note{margin:16px 0 0;background:#fffbe8;border:1px solid #f1dc8a;border-radius:10px;padding:10px 14px;font-size:.88rem;line-height:1.7}
.note b{display:block;color:#8a6a00;margin-bottom:2px}
.note[hidden]{display:none}
.close{position:absolute;top:14px;right:18px;background:#fff;border:0;width:40px;height:40px;border-radius:50%;font-size:1.4rem;cursor:pointer}
/* スマホでは2列（最後に置いて上書き） */
@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .card{border-radius:10px}
  .card .body{padding:8px 10px 12px;gap:4px}
  .card h4{font-size:.84rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card p{display:none}
  .card .tag{font-size:.68rem;padding:1px 8px}
  .card .type{display:none}
}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <a class="logo" href="./">学びの<span>動画</span>ライブラリ</a>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="キーワードで探す" aria-label="キーワードで探す">
    </label>
    <a class="hd-cta" href="session/">体験セッション</a>
  </div>
</header>

<nav class="cats" aria-label="カテゴリ"><ul id="cats"></ul></nav>

<main class="wrap">
  <div class="hero" id="hero"></div>
  <section>
    <h3 class="sec-h" id="list-title">新着</h3>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div class="band">
  <div class="wrap">
    <h3>動画で学んだことを、あなたの関係に。</h3>
    <p>深層心理分析の体験セッションで、あなた自身のパターンを一緒に紐解きます。</p>
    <a class="btn" href="session/">体験セッションの詳細を見る</a>
  </div>
</div>
<footer>© 長田絵里子</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <button class="close" id="close" aria-label="閉じる">×</button>
  <div class="mbox">
    <div class="player" id="player"></div>
    <div class="mbody">
      <span class="tag" id="m-cat"></span>
      <h2 id="m-title"></h2>
      <a class="doc-btn" id="m-doc" href="#" target="_blank" rel="noopener" hidden>📄 資料（PDF）を見る</a>
      <p id="m-desc"></p>
      <div class="note" id="m-note" hidden><b>⚠ ご注意</b><span id="m-note-text"></span></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ここに動画・音声を追加していきます（上にあるものほど新しい）
   url には次のどれかを入れてください：
   ・YouTube のURL      例 https://youtu.be/xxxxxxxx
   ・Googleドライブの共有URL 例 https://drive.google.com/file/d/xxxx/view
     （共有設定を「リンクを知っている全員」にしてください）
   ・サイト内のファイル  例 videos/intro.mp4 / audio/talk.mp3
   url が空のものは「準備中」として表示されます。
   サムネイルは kicker（左上の小さい札）と catch（大きい文字）から自動で作ります。
     catch の **ここ** は強調色＋黄色マーカー、\n は改行です（1行7文字前後・3行までがきれいです）。
   自分で作った画像を使いたいときは thumb:"画像のURL" を入れてください。
   pdf:"docs/ファイル名.pdf" を入れると、動画を開いた画面に「資料（PDF）を見る」ボタンが出ます（PDFは docs フォルダに置く）。
   added:"2026-11-20" のように追加した日を入れると、14日間「NEW」が付きます。
   url が入っている動画には、古い順に #01, #02 … の番号が自動で付きます（新しい動画はリストの一番上に追加）。
   ========================================================= */
const ITEMS = [
  { title:"繰り返される衝突の罠からの脱出",
    category:"人間関係", type:"動画", duration:"", added:"2026-11-24",
    kicker:"いつも同じケンカ", catch:"原因は\n**「構造」**？！",
    desc:"夫とのすれ違い、家族との衝突、職場での摩擦…。\nなぜか毎回、\"同じパターン\"でぶつかってしまう。\n\n実はそれ、言葉選びの失敗ではありません。\n**「構造」**の問題なのです。\n\nこの動画では、\n感情で反応する「チャイルド」と、関係を育てられる「大人の自分」という2つの視点から、\n衝突がくり返される仕組みと、\nチャイルドに飲まれない大人のコミュニケーション（アサーション）を、\n具体的な返し方とあわせて紐解きます。\n\n「もう同じケンカをくり返したくない」\nそんな方は、ぜひ最後までご覧ください。",
    pdf:"docs/shoutotsu-wana.pdf",
    url:"https://youtu.be/a3huSTcDUAw", thumb:"images/thumb-shoutotsu-v2.jpg" },
  { title:"婚活は、頑張れば頑張るほど、うまくいかない？！",
    category:"婚活", type:"動画", duration:"", added:"2026-11-24",
    kicker:"頑張るほど遠のく？", catch:"婚活の\n**パラドックス**",
    desc:"「婚活を頑張っているのに、なぜか結婚にたどり着けない」\n\n行動も変えた。努力もしている。\nそれなのに、結果がついてこない。\n「私の何がいけないの？」と、自分を責めていませんか？\n\n実は、あなたの努力は間違っていません。\nただ、脳の**「移行期」**が終わっていないだけなのです。\n\nこの動画では、\n「ボスザル脳」「チンピラ猿脳」「奉仕ザル脳」という脳の3つの階層から、\n婚活がうまくいかない本当の理由と、\nアップデートを完了させる3つの鍵を紐解きます。\n\n「もう結婚したくないのかも…」\nそう感じている方こそ、ぜひ最後までご覧ください。",
    pdf:"docs/konkatsu-paradox.pdf",
    url:"https://youtu.be/VitprKeFga0", thumb:"images/thumb-konkatsu-v2.jpg" },
  { title:"「思考が現実化する」って、本当？",
    category:"自己理解", type:"動画", duration:"", added:"2026-11-20",
    kicker:"よく聞くけど…", catch:"「思考が\n**現実化**する」\nって本当？",
    desc:"「思考が現実化する」と言われるけど、\n\n願っているのに、なぜ現実は変わらないのでしょう？\n\n実は、現実を動かしているのは\n「頭で考えていること」だけではありません。\n\n無意識の信念、物事の意味づけ、感情、行動。\nそして、相手との相互作用。\n\nこの動画では、\n「思考が現実化する」という現象を\n心理学的な視点から、その仕組みを紐解きます。\n\n「願っているのに、なぜか同じ現実を繰り返す」\n\nそんな方は、ぜひ見てみてください。",
    pdf:"docs/shikou-genjitsuka.pdf",
    url:"https://youtu.be/iP4mTyXjohw", thumb:"images/thumb-shikou-genjitsuka.jpg" },
  { title:"恋愛を本当に壊すのは価値観じゃなくて、○○？！",
    category:"恋愛", type:"動画", duration:"", featured:true, added:"2026-11-20",
    kicker:"まさか私も…？", catch:"恋愛を**壊す**\n本当の原因",
    desc:"「価値観が合わないから、恋愛がうまくいかない」\n\n本当に、そうでしょうか？\n\n実は、恋愛を苦しくしているのは「価値観」そのものではありません。\n\nなぜ、好きなのに不安になるのか？\nなぜ、同じような恋愛を繰り返してしまうのか？\n\nその背景にある、あなた自身も気づいていない\n**「心の仕組み」**を紐解きます。\n\n「もう同じ恋愛を繰り返したくない」\nそんな方は、ぜひ最後までご覧ください。",
    note:"中野プロが途中「中のプロ」と呼ばれていますが、正しくは中野プロです。参考バラエティー番組は『時計仕掛けのマリッジ』です。",
    url:"https://youtu.be/MtpCGvljZiA", thumb:"images/thumb-renai-kowasu.jpg" },
  { title:"夫婦のすれ違いはどこから始まる？ 「言わなくてもわかって」の正体",
    category:"夫婦関係", type:"動画", duration:"9:45",
    kicker:"夫婦のすれ違い", catch:"「言わなくても\n**わかって**」が\n危ない理由",
    desc:"期待と失望のくり返しが生まれる理由と、関係を立て直す最初の一歩。", url:"" },
  { title:"ラジオ：自己肯定感と恋愛の深い関係",
    category:"自己理解", type:"音声", duration:"18:20",
    kicker:"聞くだけでOK", catch:"自己肯定感が\n低いと恋が\n**苦しい**理由",
    desc:"通勤中や家事をしながら聞ける音声解説です。", url:"" },
  { title:"親との関係が今のパートナーシップに与える影響",
    category:"自己理解", type:"動画", duration:"14:05",
    kicker:"見落としがち", catch:"**親との関係**が\n恋愛に出る",
    desc:"子どもの頃に身につけた「愛され方」が、大人の恋愛にどう現れるのか。", url:"" },
  { title:"復縁したいときに最初にやるべきこと・やってはいけないこと",
    category:"恋愛", type:"動画", duration:"11:10",
    kicker:"焦る前に見て", catch:"復縁で**絶対に**\nやってはいけない\nこと",
    desc:"焦って動く前に知っておきたい、心の整え方。", url:"" },
  { title:"ケンカが増えたときに読み解きたい「本当の気持ち」",
    category:"夫婦関係", type:"音声", duration:"16:40",
    kicker:"聞くだけでOK", catch:"怒りの奥の\n**本当の気持ち**",
    desc:"怒りの奥にある感情に目を向けると、会話が変わります。", url:"" },
  { title:"体験セッションでは何をするの？ 流れをご紹介",
    category:"セッション紹介", type:"動画", duration:"6:00",
    kicker:"はじめての方へ", catch:"体験セッションで\n**何がわかる？**",
    desc:"初めての方向けに、体験セッションの流れと受けた方の変化をご紹介します。", url:"" },
];
/* ランキング表示する動画（上の一覧の番号。0が一番上） */
const RANKING = [3, 4, 6, 5, 7];
</script>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function parse(url){
    if(!url) return {kind:"none"};
    let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
    if(m) return {kind:"youtube", id:m[1]};
    m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/);
    if(m) return {kind:"drive", id:m[1]};
    if(/\.(mp3|m4a|wav|ogg)(\?|$)/i.test(url)) return {kind:"audio", src:url};
    return {kind:"video", src:url};
  }
  // サムネイルの文字：**ここ** が強調色＋マーカー、改行は \n
  // 説明文：一覧では ** を外し、動画を開いたときは **ここ** を太字にする
  const plain = t => esc(String(t ?? "").replace(/\*\*/g,""));
  const rich = t => esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  const fmt = t => esc(t).replace(/\*\*(.+?)\*\*/g,"<em>$1</em>").replace(/\n/g,"<br>");
  // いちばん長い行が枠に収まるよう文字サイズを自動調整
  const fs = t => { const ls = t.replace(/\*\*/g,"").split("\n");
    const max = Math.max(...ls.map(l=>[...l].length));
    return Math.min(ls.length>=3 ? 7.4 : 8.6, 56/max).toFixed(2); };
  // 番号：URLが入っている動画に、古い順に #01, #02 … と付ける
  const EP = new Map(); ITEMS.filter(i=>i.url).reverse().forEach((it,n)=>EP.set(it, n+1));
  // NEW：added（追加した日）から14日間表示
  const isNew = it => it.added && (Date.now() - new Date(it.added+"T00:00:00+09:00")) < 14*864e5;
  const marks = it => (EP.has(it)||isNew(it)) ? `<div class="marks">${isNew(it)?'<span class="new">NEW</span>':""}${EP.has(it)?`<span class="ep">#${String(EP.get(it)).padStart(2,"0")}</span>`:""}</div>` : "";
  function thumbHTML(it){
    const audio = it.type==="音声";
    const label = it.url ? (it.duration || (audio ? "音声" : "動画")) : "準備中";
    const badge = `<span class="badge${audio?" audio":""}">${esc(label)}</span>`;
    const play = `<span class="play" aria-hidden="true"></span>`;
    if(it.thumb) return `<div class="thumb"><img class="bg" src="${esc(it.thumb)}" alt="" loading="lazy">${marks(it)}${play}${it.url ? "" : badge}</div>`;
    return `<div class="thumb" data-cat="${esc(it.category)}" aria-hidden="true">
      <span class="face"></span>
      <div class="copy">${it.kicker?`<span class="kicker">${esc(it.kicker)}</span>`:""}<p class="catch" style="--fs:${fs(it.catch || it.title)}cqw">${fmt(it.catch || it.title)}</p></div>
      ${marks(it)}${play}${badge}</div>`;
  }
  const meta = it => `<div><span class="tag" data-cat="${esc(it.category)}">${esc(it.category)}</span><span class="type">${esc(it.type)}</span>${it.pdf?'<span class="has-doc">📄 資料あり</span>':""}</div>`;

  const cats = ["すべて", ...new Set(ITEMS.map(i=>i.category))];
  let cur = "すべて", q = "";

  $("#cats").innerHTML = cats.map(c=>`<li><button data-c="${esc(c)}" data-cat="${esc(c)}" aria-pressed="${c===cur}">${esc(c)}</button></li>`).join("");
  $("#cats").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    cur = b.dataset.c;
    document.querySelectorAll("#cats button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    renderGrid();
    // 絞り込んだ一覧の先頭が見えるように移動
    const top = document.querySelector("main").getBoundingClientRect().top + scrollY - document.querySelector("header").offsetHeight - document.querySelector(".cats").offsetHeight;
    if(scrollY > top) scrollTo({top, behavior:"smooth"});
  });
  $("#q").addEventListener("input", e=>{ q = e.target.value.trim(); renderGrid(); });

  function renderHero(){
    const fi = Math.max(0, ITEMS.findIndex(i=>i.featured));
    const f = ITEMS[fi];
    $("#hero").innerHTML = `
      <article class="feat" tabindex="0" data-i="${fi}" data-cat="${esc(f.category)}">
        ${thumbHTML(f)}
        <div class="body">${meta(f)}<h2>${esc(f.title)}</h2><p>${plain(f.desc)}</p></div>
      </article>
      <aside class="side">
        <h3>よく見られている動画</h3>
        <ol class="rank">${RANKING.filter(i=>ITEMS[i]).map((i,n)=>`
          <li tabindex="0" data-i="${i}"><span class="n">${n+1}</span>${thumbHTML(ITEMS[i])}<span class="t">${esc(ITEMS[i].title)}</span></li>`).join("")}
        </ol>
      </aside>`;
  }
  function renderGrid(){
    // カテゴリを選んだときや検索中は、大きい枠とランキングを隠して結果だけを見せる
    $("#hero").style.display = (cur==="すべて" && !q) ? "" : "none";
    const list = ITEMS.map((it,i)=>({it,i})).filter(({it})=>
      (cur==="すべて" || it.category===cur) &&
      (!q || (it.title+it.desc+it.category).toLowerCase().includes(q.toLowerCase())));
    $("#list-title").textContent = q ? `「${q}」の検索結果` : (cur==="すべて" ? "新着" : cur);
    $("#grid").innerHTML = list.length ? list.map(({it,i})=>`
      <article class="card" tabindex="0" data-i="${i}" data-cat="${esc(it.category)}">
        ${thumbHTML(it)}
        <div class="body">${meta(it)}<h4>${esc(it.title)}</h4><p>${plain(it.desc)}</p></div>
      </article>`).join("") : `<p class="empty">該当する動画が見つかりませんでした。</p>`;
  }

  const modal = $("#modal"), player = $("#player");
  let lastFocus = null;
  function open(i){
    const it = ITEMS[i]; if(!it) return;
    const p = parse(it.url);
    player.className = "player";
    if(p.kind==="youtube") player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${p.id}?rel=0" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(it.title)}"></iframe>`;
    else if(p.kind==="drive") player.innerHTML = `<iframe src="https://drive.google.com/file/d/${p.id}/preview" allow="autoplay; fullscreen" allowfullscreen title="${esc(it.title)}"></iframe>`;
    else if(p.kind==="audio"){ player.className="player audio"; player.innerHTML = `<audio controls autoplay src="${esc(p.src)}"></audio>`; }
    else if(p.kind==="video") player.innerHTML = `<video controls autoplay playsinline src="${esc(p.src)}"></video>`;
    else player.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#f9c6da,#e6337f);font-weight:700">この動画は準備中です</div>`;
    $("#m-cat").textContent = it.category;
    $("#m-title").textContent = it.title;
    $("#m-desc").innerHTML = rich(it.desc || "");
    $("#m-doc").hidden = !it.pdf;
    if(it.pdf) $("#m-doc").href = it.pdf;
    $("#m-note").hidden = !it.note;
    $("#m-note-text").textContent = it.note || "";
    lastFocus = document.activeElement;
    modal.classList.add("open");
    document.body.style.overflow = "hidden";
    $("#close").focus();
  }
  function close(){
    modal.classList.remove("open");
    player.innerHTML = "";
    document.body.style.overflow = "";
    lastFocus && lastFocus.focus();
  }
  document.addEventListener("click", e=>{
    const t = e.target.closest("[data-i]");
    if(t && !modal.contains(t)) open(+t.dataset.i);
  });
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape" && modal.classList.contains("open")) close();
    if((e.key==="Enter"||e.key===" ") && e.target.matches("[data-i]")){ e.preventDefault(); open(+e.target.dataset.i); }
  });
  $("#close").addEventListener("click", close);
  modal.addEventListener("click", e=>{ if(e.target===modal) close(); });

  renderHero(); renderGrid();
})();
</script>
</body>
</html>
